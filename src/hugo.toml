baseURL = 'https://jedt3d.github.io/wbasic-documents/'
title = 'WBasic Reference'
theme = 'wbasic'
publishDir = '../html'
defaultContentLanguage = 'th'
defaultContentLanguageInSubdir = true
enableGitInfo = false
enableRobotsTXT = true
relativeURLs = false
summaryLength = 28

[outputs]
  home = ['html', 'json']
  section = ['html']
  page = ['html']

[markup]
  [markup.highlight]
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[languages]
  [languages.en]
    locale = 'en-US'
    label = 'English'
    contentDir = 'content/en'
    title = 'WBasic Reference'
    weight = 2
    [languages.en.params]
      description = 'WBasic language, standard library, and API reference'
  [languages.th]
    locale = 'th-TH'
    label = 'ไทย'
    contentDir = 'content/th'
    title = 'คู่มืออ้างอิง WBasic'
    weight = 1
    [languages.th.params]
      description = 'คู่มือภาษา ไลบรารีมาตรฐาน และ API ของ WBasic'

[params]
  productName = 'WBasic'
  referenceVersion = '0.3 draft'
