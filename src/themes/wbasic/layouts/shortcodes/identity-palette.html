{{ if eq .Page.Language.Lang "en" }}
<div class="identity-palette" data-identity-palette aria-label="The five WBasic identity colors">
  <figure class="identity-color identity-color-charcoal"><div></div><figcaption><strong>Tungsten charcoal</strong><code>#26343D</code><span>Text and dark backgrounds</span></figcaption></figure>
  <figure class="identity-color identity-color-teal"><div></div><figcaption><strong>Deep teal</strong><code>#237F83</code><span>Deliberate accents</span></figcaption></figure>
  <figure class="identity-color identity-color-mist"><div></div><figcaption><strong>Mist</strong><code>#F3F6F4</code><span>The main reading surface</span></figcaption></figure>
  <figure class="identity-color identity-color-sage"><div></div><figcaption><strong>Sage</strong><code>#B9CEC4</code><span>Panels and selected states</span></figcaption></figure>
  <figure class="identity-color identity-color-sand"><div></div><figcaption><strong>Warm sand</strong><code>#D9C5A4</code><span>Notes and special values</span></figcaption></figure>

{{ else }}
<div class="identity-palette" data-identity-palette aria-label="สีประจำตัว WBasic ห้าสี">
